# Databricks Asset Bundle for the Vstone project.
# All environment-specific values are variables (no hard-coding).
bundle:
  name: vstone-databricks-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every Vstone schema
    default: vstone
  landing_schema:
    default: landing
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  governance_schema:
    default: governance
  ops_schema:
    default: ops
  raw_volume:
    default: raw
  chunks_volume:
    default: chunks
  notification_email:
    description: Address that receives job failure emails
    default: jjain1374@gmail.com
  # Date cut-offs used by the Data Chunking job (chunk N = dates <= cut-off N)
  chunk1_end_date:
    default: "2005-12-31"
  chunk2_end_date:
    default: "2012-12-31"
  chunk3_end_date:
    default: "2015-12-31"
  force_rechunk:
    description: "true = overwrite the 4 landed files on purpose (Bronze must then be reset)"
    default: "false"
  # Task parameters: which chunk file each Bronze ingestion task loads (see conf/vstone_config.json -> chunks)
  copy_into_chunk_no:
    default: "1"
  dlt_chunk_no:
    default: "2"
  autoloader_chunk_no:
    default: "3"
  xml_chunk_no:
    default: "4"
  bronze_check_chunk_nos:
    description: Chunks whose Bronze tables the sanity checks cover
    default: "1,2,3,4"
  include_reference:
    description: Load / check the 2 crosswalk tables together with chunk 1
    default: "true"
  silver_levels:
    description: Geography levels the Silver job builds ("all" or a comma list)
    default: all
  demo_region:
    description: State used by the feature preview and the time-travel demo
    default: California
  late_batch:
    description: Name of the late-arriving batch (Day 7); a new name lands a new file
    default: batch1
  benchmark_runs:
    description: How many times each benchmark query runs per layout
    default: "3"
  benchmark_layouts:
    description: Layouts compared by the benchmark
    default: plain,partition_zorder,liquid

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-247f8dcb-efec.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-247f8dcb-efec.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      catalog: vstone_prod
