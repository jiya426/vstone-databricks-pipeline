name: databricks-ci-cd

# All Databricks jobs and pipelines are triggered from here - never with "Run now" in the Databricks UI.
#
# PR into dev/main     : unit + integration tests on real-data samples, bundle validation (gate)
# push to dev          : tests -> deploy to dev -> run Data Chunking -> Bronze ingestion -> Silver transform -> Gold
# push to main         : tests -> deploy to prod
# Run workflow (manual): tests -> deploy to dev -> run the job(s) picked in the form
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      jobs_to_run:
        description: Which dev job(s) to run after deploying
        type: choice
        default: all
        options:
          - all
          - data_chunking
          - bronze_ingestion
          - silver_transform
          - gold
          - none

jobs:
  test:
    name: Unit tests and bundle validation
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: pytest tests -v --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev

  deploy-dev:
    name: Deploy to dev and run the jobs
    needs: test
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs_to_run || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev
      - name: "Run job: Data Chunking (lands the 4 files; skipped files are not rewritten)"
        if: env.JOBS == 'all' || env.JOBS == 'data_chunking'
        run: databricks bundle run -t dev data_chunking
      - name: "Run job: Bronze ingestion (4 files -> 4 Bronze tables + sanity checks)"
        if: env.JOBS == 'all' || env.JOBS == 'bronze_ingestion'
        run: databricks bundle run -t dev bronze_ingestion
      - name: "Run job: Silver transform (cleaning, business rules, features + checks)"
        if: env.JOBS == 'all' || env.JOBS == 'silver_transform'
        run: databricks bundle run -t dev silver_transform
      - name: "Run job: Gold (star schema, aggregates, checks, business glossary)"
        if: env.JOBS == 'all' || env.JOBS == 'gold'
        run: databricks bundle run -t dev gold

  deploy-prod:
    name: Deploy to prod
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
