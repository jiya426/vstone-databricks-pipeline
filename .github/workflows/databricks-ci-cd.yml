name: databricks-ci-cd

# PR into dev/main : unit tests + bundle validation (gate)
# push to dev      : tests -> deploy to dev -> integration run of the jobs on serverless
# push to main     : tests -> deploy to prod
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests and bundle validation
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests -v --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev

  deploy-dev:
    name: Deploy to dev and run integration
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev
      - name: "Integration: Data Chunking job (idempotent - completed chunks are skipped)"
        run: databricks bundle run -t dev data_chunking
      - name: "Integration: Bronze ingestion job + sanity checks (re-run loads only new files)"
        run: databricks bundle run -t dev bronze_ingestion

  deploy-prod:
    name: Deploy to prod
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
