# Job: layout benchmark (PDF Day 7) - Liquid Clustering vs partitioning + Z-order vs no layout.
# Run on demand from GitHub Actions ("Run workflow" -> performance_benchmark).
resources:
  jobs:
    performance_benchmark:
      name: vstone_performance_benchmark
      description: >
        Copies the Gold fact into 3 tables that differ only in layout (none, PARTITIONED BY + ZORDER, CLUSTER BY),
        runs the same 5 query patterns on each and stores times and data-skipping counts in ops.performance_benchmark.
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        project: vstone
        layer: optimization
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: ops_schema
          default: ${var.ops_schema}
        - name: env
          default: ${bundle.target}
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: layout_benchmark
          notebook_task:
            notebook_path: ../src/notebooks/07a_performance_benchmark.py
            base_parameters:
              benchmark_runs: ${var.benchmark_runs}
              benchmark_layouts: ${var.benchmark_layouts}
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 7200
