# Lakeflow Declarative Pipeline (DLT): CSV chunk 2 -> Bronze streaming tables (PDF Day 3)
resources:
  pipelines:
    bronze_csv_dlt:
      name: vstone_bronze_csv_dlt
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../src/pipelines/bronze_csv_dlt.py
      configuration:
        vstone.catalog: ${var.catalog}
        vstone.landing_schema: ${var.landing_schema}
        vstone.raw_volume: ${var.raw_volume}
        vstone.chunks_volume: ${var.chunks_volume}
        vstone.framework_path: ${workspace.file_path}/src
