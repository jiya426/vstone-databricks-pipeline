# Job: Bronze ingestion. Day 2 = COPY INTO; Day 3 adds Auto Loader, XML and DLT tasks.
resources:
  jobs:
    bronze_ingestion:
      name: vstone_bronze_ingestion
      description: >
        Loads the Zillow chunks into the Bronze layer. Day 2: CSV chunk 1 and both crosswalks
        with COPY INTO, then sanity checks.
      max_concurrent_runs: 1
      tags:
        project: vstone
        layer: bronze
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: landing_schema
          default: ${var.landing_schema}
        - name: raw_volume
          default: ${var.raw_volume}
        - name: chunks_volume
          default: ${var.chunks_volume}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: ops_schema
          default: ${var.ops_schema}
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: bronze_copy_into_csv
          notebook_task:
            notebook_path: ../src/notebooks/03a_bronze_copy_into.py
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 3600
        - task_key: bronze_sanity_checks
          depends_on:
            - task_key: bronze_copy_into_csv
          notebook_task:
            notebook_path: ../src/notebooks/03z_bronze_sanity_checks.py
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 1800
